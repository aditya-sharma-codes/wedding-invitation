<svg viewBox="0 0 280 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="archGoldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D39E"/>
      <stop offset="50%" stop-color="#C59A4E"/>
      <stop offset="100%" stop-color="#8B6925"/>
    </linearGradient>
  </defs>

  <!-- Outer Scalloped Mughal Mandap Arch -->
  <path d="M20 135 V75 C20 40 60 14 140 14 C220 14 260 40 260 75 V135" stroke="url(#archGoldFoil)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Inner Scalloped Profile -->
  <path d="M34 135 V78 C34 48 70 24 140 24 C210 24 246 48 246 78 V135" stroke="url(#archGoldFoil)" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Left & Right Arch Pillars / Columns with Moulding Base -->
  <rect x="14" y="65" width="12" height="70" fill="#7A1A24" fill-opacity="0.08" stroke="#C59A4E" stroke-width="0.8"/>
  <rect x="254" y="65" width="12" height="70" fill="#7A1A24" fill-opacity="0.08" stroke="#C59A4E" stroke-width="0.8"/>
  <rect x="10" y="132" width="20" height="6" rx="1" fill="url(#archGoldFoil)"/>
  <rect x="250" y="132" width="20" height="6" rx="1" fill="url(#archGoldFoil)"/>

  <!-- Top Kalash Finial on Dome Peak -->
  <path d="M140 2 L148 14 H132 Z" fill="url(#archGoldFoil)"/>
  <circle cx="140" cy="2" r="2.5" fill="#7A1A24" stroke="#E8D39E" stroke-width="0.8"/>

  <!-- Hanging Decorative Toran Drops from Arch -->
  <circle cx="80" cy="42" r="3" fill="#7A1A24" stroke="#C59A4E" stroke-width="0.8"/>
  <path d="M80 32 V39" stroke="#C59A4E" stroke-width="0.8"/>
  <circle cx="200" cy="42" r="3" fill="#7A1A24" stroke="#C59A4E" stroke-width="0.8"/>
  <path d="M200 32 V39" stroke="#C59A4E" stroke-width="0.8"/>

  <!-- Central Lotus Blossom under Peak -->
  <circle cx="140" cy="50" r="14" fill="#FFFDF8" stroke="#C59A4E" stroke-width="1.2"/>
  <circle cx="140" cy="50" r="11" fill="none" stroke="#7A1A24" stroke-width="0.6" stroke-dasharray="1.5 2"/>
  <path d="M140 40 C136 45 136 55 140 60 C144 55 144 45 140 40 Z" fill="#7A1A24"/>
  <path d="M130 50 C135 46 145 46 150 50 C145 54 135 54 130 50 Z" fill="#C59A4E"/>
  <circle cx="140" cy="50" r="3" fill="#E8D39E"/>
</svg>